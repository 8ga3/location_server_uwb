<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="Helvetica, Arial, sans-serif">
  <title>DL-TDoA スーパーフレーム構成 (20Hz)</title>

  <rect x="0" y="0" width="100%" height="100%" rx="10" fill="#f6f8fa"/>

  <!-- 上段: 50ms スーパーフレーム -->
  <text x="40" y="30" fill="#3d4a56" font-size="15">スーパーフレーム 50 ms (= 20 Hz)。電波を出しているのは先頭 2.5 ms だけ</text>

  <rect x="60" y="48" width="600" height="30" fill="none" stroke="#6b7785" stroke-width="1"/>
  <rect x="60" y="48" width="30" height="30" fill="#2e86c1"/>
  <text x="375" y="68" fill="#6b7785" font-size="13" text-anchor="middle">アイドル (占有率 5 %)</text>
  <text x="60" y="98" fill="#3d4a56" font-size="12" text-anchor="middle">0</text>
  <text x="660" y="98" fill="#3d4a56" font-size="12" text-anchor="middle">50 ms</text>

  <!-- ズーム補助線 -->
  <path d="M 60,78 L 60,150 M 90,78 L 660,150" stroke="#6b7785" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <!-- 下段: ラウンド内スロット (アンカー 4 台 = Initiator 1 + Responder 3) -->
  <text x="40" y="180" fill="#3d4a56" font-size="15">ラウンド 2.5 ms: スロット 500 &#181;s &#215; 5 フレーム (アンカー 4 台の場合)</text>

  <rect x="60"  y="196" width="100" height="40" fill="#2e86c1"/>
  <rect x="160" y="196" width="100" height="40" fill="#27ae60"/>
  <rect x="260" y="196" width="100" height="40" fill="#27ae60"/>
  <rect x="360" y="196" width="100" height="40" fill="#27ae60"/>
  <rect x="460" y="196" width="100" height="40" fill="#8e44ad"/>
  <rect x="560" y="196" width="100" height="40" fill="none" stroke="#6b7785" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="110" y="221" fill="#ffffff" font-size="13" text-anchor="middle">Poll</text>
  <text x="210" y="221" fill="#ffffff" font-size="13" text-anchor="middle">Resp A1</text>
  <text x="310" y="221" fill="#ffffff" font-size="13" text-anchor="middle">Resp A2</text>
  <text x="410" y="221" fill="#ffffff" font-size="13" text-anchor="middle">Resp A3</text>
  <text x="510" y="221" fill="#ffffff" font-size="13" text-anchor="middle">Final</text>
  <text x="610" y="221" fill="#6b7785" font-size="13" text-anchor="middle">guard</text>

  <text x="110" y="254" fill="#3d4a56" font-size="12" text-anchor="middle">A0 (Initiator)</text>
  <text x="310" y="254" fill="#3d4a56" font-size="12" text-anchor="middle">Responder が順に応答</text>
  <text x="510" y="254" fill="#3d4a56" font-size="12" text-anchor="middle">A0</text>

  <text x="40" y="292" fill="#6b7785" font-size="13">1 フレームの空中時間は約 200 &#181;s (Ch9 / 6.8 Mbps / PLEN128)。残り 300 &#181;s がホスト処理と伝搬のマージン</text>
  <text x="40" y="312" fill="#6b7785" font-size="13">タグは全スロットを受信するだけ。送信しないのでタグが何台いてもこの図は変わらない</text>
</svg>
